<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1790 350" role="img" aria-labelledby="title desc">
  <title id="title">Pynqo AI compilation stack</title>
  <desc id="desc">Model format to PyTorch (torch.export, FX quantization) to Torch-MLIR to the Pynqo middle end (decomposition, fusion, lowering, device partition), which feeds a CPU backend (loop interchange, LLVM IR codegen) and an NPU backend (tiling, weight packing, NPU program codegen). The CPU backend emits LLVM IR, which LLVM (opt, llc, ld.lld) turns into a .so that the runtime runs on the ARM Cortex-A9. The NPU backend emits NPU programs (an NPU ISA stream for the custom scalar core, or RV32 code for CVA6) that the driver runs on the NPU; the runtime reaches the driver through __delegate__.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3b3631"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#444"/></marker>
    <style>
      text { font-family: Helvetica, Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill:#2f2a25; font-size:17px }
      .bg { fill:#fbf8f3 }
      .box { fill:#fffdf9; stroke:#5b524a; stroke-width:2.5 }
      .frame { fill:#f2ece3; stroke:#5b524a; stroke-width:2.5 }
      .ar { stroke:#3b3631; stroke-width:4.5; fill:none }
      .lbl { font-size:15px }
      .sm { font-size:14px; opacity:.8 }
      .ttl { font-weight:700; font-size:18px }
      .cap { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", serif; font-size:21px }
      .mono { font-family: Consolas, Menlo, monospace; font-size:13px; fill:#444 }
      .dev { fill:#3b3631; stroke:#3b3631; stroke-width:2.5 }
      .dt { fill:#fffdf9; font-weight:700; font-size:16px }
      .ds { fill:#fffdf9; font-size:12.5px; opacity:.85 }
    </style>
  </defs>
  <rect width="1790" height="350" class="bg"/>

  <!-- Model Format -->
  <rect x="20" y="120" width="140" height="96" rx="6" class="box"/>
  <text x="90" y="152" text-anchor="middle" class="ttl">Model Format</text>
  <text x="90" y="178" text-anchor="middle" class="sm">.safetensors</text>
  <text x="90" y="198" text-anchor="middle" class="sm">.torchvision</text>
  <path d="M160 168H202" class="ar" marker-end="url(#a)"/>

  <!-- PyTorch -->
  <rect x="210" y="120" width="170" height="96" class="box"/>
  <text x="295" y="152" text-anchor="middle" class="ttl">PyTorch</text>
  <text x="295" y="178" text-anchor="middle">torch.export,</text>
  <text x="295" y="200" text-anchor="middle">FX quantization</text>
  <path d="M380 168H442" class="ar" marker-end="url(#a)"/>
  <text x="413" y="196" text-anchor="middle" class="lbl">ATen</text>

  <!-- Torch-MLIR -->
  <rect x="450" y="120" width="150" height="96" class="box"/>
  <text x="525" y="174" text-anchor="middle" class="ttl">Torch-MLIR</text>
  <path d="M600 168H654" class="ar" marker-end="url(#a)"/>
  <text x="628" y="196" text-anchor="middle" class="lbl">Torch</text>
  <text x="628" y="215" text-anchor="middle" class="lbl">Dialect</text>

  <!-- Pynqo MLIR frame -->
  <rect x="662" y="36" width="450" height="236" rx="8" class="frame"/>
  <text x="887" y="62" text-anchor="middle" class="ttl" style="font-size:20px">Pynqo MLIR</text>

  <!-- Middle End -->
  <rect x="676" y="80" width="190" height="174" class="box"/>
  <text x="771" y="109" text-anchor="middle" class="ttl">Middle End</text>
  <text x="694" y="144">Decomposition,</text>
  <text x="694" y="170">Fusion,</text>
  <text x="694" y="196">Lowering,</text>
  <text x="694" y="222">Device partition</text>

  <!-- Middle End -> CPU Backend and NPU Backend -->
  <path d="M866 167H882V119H898" class="ar" stroke-linejoin="round" marker-end="url(#a)"/>
  <path d="M882 167V215H898" class="ar" stroke-linejoin="round" marker-end="url(#a)"/>

  <!-- CPU Backend -->
  <rect x="906" y="80" width="190" height="78" class="box"/>
  <text x="1001" y="106" text-anchor="middle" class="ttl">CPU Backend</text>
  <text x="1001" y="129" text-anchor="middle" class="lbl">Loop interchange,</text>
  <text x="1001" y="148" text-anchor="middle" class="lbl">LLVM IR codegen</text>

  <!-- NPU Backend -->
  <rect x="906" y="176" width="190" height="78" class="box"/>
  <text x="1001" y="202" text-anchor="middle" class="ttl">NPU Backend</text>
  <text x="1001" y="225" text-anchor="middle" class="lbl">Tiling, weight packing,</text>
  <text x="1001" y="244" text-anchor="middle" class="lbl">NPU program codegen</text>

  <!-- CPU line: CPU Backend -> LLVM -> Runtime -> CPU -->
  <path d="M1096 119H1182" class="ar" marker-end="url(#a)"/>
  <text x="1146" y="107" text-anchor="middle" class="lbl">LLVM IR</text>
  <rect x="1190" y="81" width="130" height="76" class="box"/>
  <text x="1255" y="113" text-anchor="middle" class="ttl">LLVM</text>
  <text x="1255" y="137" text-anchor="middle" class="sm">opt, llc, ld.lld</text>
  <path d="M1320 119H1372" class="ar" marker-end="url(#a)"/>
  <text x="1346" y="107" text-anchor="middle" class="lbl">.so</text>
  <rect x="1380" y="87" width="140" height="64" class="box"/>
  <text x="1450" y="125" text-anchor="middle" class="ttl">Runtime</text>
  <path d="M1520 119H1562" class="ar" marker-end="url(#a)"/>

  <!-- NPU line: NPU Backend -> Driver -> NPU -->
  <path d="M1096 215H1372" class="ar" marker-end="url(#a)"/>
  <text x="1234" y="185" text-anchor="middle" class="lbl">NPU ISA (custom)</text>
  <text x="1234" y="204" text-anchor="middle" class="lbl">RV32 (CVA6)</text>
  <rect x="1380" y="183" width="140" height="64" class="box"/>
  <text x="1450" y="221" text-anchor="middle" class="ttl">Driver</text>
  <path d="M1520 215H1562" class="ar" marker-end="url(#a)"/>

  <!-- delegate: runtime -> driver -->
  <path d="M1450 151V179" stroke="#444" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#d)"/>
  <text x="1458" y="170" class="mono">__delegate__</text>

  <!-- CPU -->
  <rect x="1570" y="79" width="200" height="80" class="dev"/>
  <svg x="1576" y="89" width="60" height="60" viewBox="0 -960 960 960"><path d="M360 -120v-80H260q-24 0-42-18t-18-42v-100h-80v-60h80v-124h-80v-60h80v-100q0-24 18-42t42-18h100v-76h60v76h124v-76h60v76h100q24 0 42 18t18 42v100h76v60h-76v124h76v60h-76v100q0 24-18 42t-42 18H604v80h-60v-80H420v80h-60Zm344-140v-444H260v444h444ZM480-480Z" fill="#fffdf9"/></svg>
  <text x="1606" y="123" text-anchor="middle" style="fill:#fffdf9;font-size:10px;font-weight:700">CPU</text>
  <text x="1644" y="125" class="dt">ARM Cortex-A9</text>

  <!-- NPU -->
  <rect x="1570" y="175" width="200" height="80" class="dev"/>
  <svg x="1576" y="185" width="60" height="60" viewBox="0 -960 960 960"><path d="M360 -120v-80H260q-24 0-42-18t-18-42v-100h-80v-60h80v-124h-80v-60h80v-100q0-24 18-42t42-18h100v-76h60v76h124v-76h60v76h100q24 0 42 18t18 42v100h76v60h-76v124h76v60h-76v100q0 24-18 42t-42 18H604v80h-60v-80H420v80h-60Zm344-140v-444H260v444h444ZM480-480Z" fill="#fffdf9"/></svg>
  <text x="1606" y="219" text-anchor="middle" style="fill:#fffdf9;font-size:10px;font-weight:700">NPU</text>
  <text x="1644" y="221" class="dt">NPU</text>

  <text x="895" y="322" text-anchor="middle" class="cap">Figure 1: Pynqo — AI Compilation Stack (PYNQ-Z1)</text>
</svg>
