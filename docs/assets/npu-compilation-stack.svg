<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1790 350" role="img" aria-labelledby="title desc">
  <title id="title">Pynqo AI compilation stack</title>
  <desc id="desc">Model format to PyTorch (torch.export, FX-pass W8A8 quantization) to Torch-MLIR to the Pynqo middle end (decomposition, fusion, lowering to linalg, device partition) and back end (CPU: unit-stride loop interchange; NPU: tiling, weight packing and programs). The back end emits LLVM IR, which LLVM (opt with loop vectorization, llc, ld.lld) turns into a .so that the runtime runs on the ARM Cortex-A9 with NEON, and NPU programs (the npu_pynq ISA stream for the custom scalar core, or the risc_v_npu RV32 GEMM kernel for CVA6) that the driver runs on the NPU; the runtime reaches the driver through __delegate__.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3b3631"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#444"/></marker>
    <style>
      text { font-family: Helvetica, Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill:#2f2a25; font-size:17px }
      .bg { fill:#fbf8f3 }
      .box { fill:#fffdf9; stroke:#5b524a; stroke-width:2.5 }
      .frame { fill:#f2ece3; stroke:#5b524a; stroke-width:2.5 }
      .ar { stroke:#3b3631; stroke-width:4.5; fill:none }
      .lbl { font-size:15px }
      .sm { font-size:14px; opacity:.8 }
      .ttl { font-weight:700; font-size:18px }
      .cap { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", serif; font-size:21px }
      .mono { font-family: Consolas, Menlo, monospace; font-size:13px; fill:#444 }
      .dev { fill:#3b3631; stroke:#3b3631; stroke-width:2.5 }
      .dt { fill:#fffdf9; font-weight:700; font-size:16px }
      .ds { fill:#fffdf9; font-size:12.5px; opacity:.85 }
    </style>
  </defs>
  <rect width="1790" height="350" class="bg"/>

  <!-- Model Format -->
  <rect x="20" y="120" width="140" height="96" rx="6" class="box"/>
  <text x="90" y="152" text-anchor="middle" class="ttl">Model Format</text>
  <text x="90" y="178" text-anchor="middle" class="sm">.safetensors</text>
  <text x="90" y="198" text-anchor="middle" class="sm">.torchvision</text>
  <path d="M160 168H202" class="ar" marker-end="url(#a)"/>

  <!-- PyTorch -->
  <rect x="210" y="120" width="170" height="96" class="box"/>
  <text x="295" y="152" text-anchor="middle" class="ttl">PyTorch</text>
  <text x="295" y="178" text-anchor="middle">torch.export,</text>
  <text x="295" y="200" text-anchor="middle">FX quantization</text>
  <path d="M380 168H442" class="ar" marker-end="url(#a)"/>
  <text x="413" y="196" text-anchor="middle" class="lbl">ATen</text>

  <!-- Torch-MLIR -->
  <rect x="450" y="120" width="150" height="96" class="box"/>
  <text x="525" y="174" text-anchor="middle" class="ttl">Torch-MLIR</text>
  <path d="M600 168H654" class="ar" marker-end="url(#a)"/>
  <text x="628" y="196" text-anchor="middle" class="lbl">Torch</text>
  <text x="628" y="215" text-anchor="middle" class="lbl">Dialect</text>

  <!-- Pynqo MLIR frame -->
  <rect x="662" y="36" width="450" height="236" rx="8" class="frame"/>
  <text x="887" y="62" text-anchor="middle" class="ttl" style="font-size:20px">Pynqo MLIR</text>

  <!-- Middle End -->
  <rect x="676" y="80" width="190" height="174" class="box"/>
  <text x="771" y="109" text-anchor="middle" class="ttl">Middle End</text>
  <text x="694" y="144">Decomposition,</text>
  <text x="694" y="170">Fusion,</text>
  <text x="694" y="196">Lowering to linalg,</text>
  <text x="694" y="222">Device partition</text>
  <path d="M866 168H898" class="ar" marker-end="url(#a)"/>

  <!-- Backend -->
  <rect x="906" y="80" width="190" height="174" class="box"/>
  <text x="1001" y="109" text-anchor="middle" class="ttl">Backend</text>
  <text x="924" y="144">CPU: loop</text>
  <text x="924" y="170">interchange,</text>
  <text x="924" y="196">NPU: tiling,</text>
  <text x="924" y="222">packing, programs</text>

  <!-- CPU line -->
  <path d="M1096 104H1182" class="ar" marker-end="url(#a)"/>
  <text x="1146" y="92" text-anchor="middle" class="lbl">LLVM IR</text>
  <rect x="1190" y="66" width="130" height="76" class="box"/>
  <text x="1255" y="98" text-anchor="middle" class="ttl">LLVM</text>
  <text x="1255" y="122" text-anchor="middle" class="sm">opt, llc, ld.lld</text>
  <path d="M1320 104H1372" class="ar" marker-end="url(#a)"/>
  <text x="1346" y="92" text-anchor="middle" class="lbl">.so</text>
  <rect x="1380" y="72" width="140" height="64" class="box"/>
  <text x="1450" y="110" text-anchor="middle" class="ttl">Runtime</text>
  <path d="M1520 104H1562" class="ar" marker-end="url(#a)"/>

  <!-- NPU line -->
  <path d="M1096 232H1372" class="ar" marker-end="url(#a)"/>
  <text x="1240" y="202" text-anchor="middle" class="lbl">npu_pynq: NPU ISA</text>
  <text x="1240" y="221" text-anchor="middle" class="lbl">risc_v_npu: RV32 GEMM kernel</text>
  <rect x="1380" y="200" width="140" height="64" class="box"/>
  <text x="1450" y="238" text-anchor="middle" class="ttl">Driver</text>
  <path d="M1520 232H1562" class="ar" marker-end="url(#a)"/>

  <!-- delegate: runtime -> driver -->
  <path d="M1450 136V196" stroke="#444" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#d)"/>
  <text x="1458" y="170" class="mono">__delegate__</text>

  <!-- CPU -->
  <rect x="1570" y="64" width="200" height="80" class="dev"/>
  <svg x="1576" y="74" width="60" height="60" viewBox="0 -960 960 960"><path d="M360 -120v-80H260q-24 0-42-18t-18-42v-100h-80v-60h80v-124h-80v-60h80v-100q0-24 18-42t42-18h100v-76h60v76h124v-76h60v76h100q24 0 42 18t18 42v100h76v60h-76v124h76v60h-76v100q0 24-18 42t-42 18H604v80h-60v-80H420v80h-60Zm344-140v-444H260v444h444ZM480-480Z" fill="#fffdf9"/></svg>
  <text x="1606" y="108" text-anchor="middle" style="fill:#fffdf9;font-size:10px;font-weight:700">CPU</text>
  <text x="1644" y="102" class="dt">ARM Cortex-A9</text>
  <text x="1644" y="122" class="ds">+ NEON</text>

  <!-- NPU -->
  <rect x="1570" y="192" width="200" height="80" class="dev"/>
  <svg x="1576" y="202" width="60" height="60" viewBox="0 -960 960 960"><path d="M360 -120v-80H260q-24 0-42-18t-18-42v-100h-80v-60h80v-124h-80v-60h80v-100q0-24 18-42t42-18h100v-76h60v76h124v-76h60v76h100q24 0 42 18t18 42v100h76v60h-76v124h76v60h-76v100q0 24-18 42t-42 18H604v80h-60v-80H420v80h-60Zm344-140v-444H260v444h444ZM480-480Z" fill="#fffdf9"/></svg>
  <text x="1606" y="236" text-anchor="middle" style="fill:#fffdf9;font-size:10px;font-weight:700">NPU</text>
  <text x="1644" y="222" class="dt">NPU</text>
  <text x="1644" y="242" class="ds">custom core or CVA6</text>
  <text x="1644" y="259" class="ds">+ 16x16 matrix core</text>

  <text x="895" y="322" text-anchor="middle" class="cap">Figure 1: Pynqo — AI Compilation Stack (PYNQ-Z1)</text>
</svg>
