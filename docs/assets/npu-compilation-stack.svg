<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1790 330" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">NPU-MLIR AI compilation stack</title>
  <desc id="desc">Model format to PyTorch (torchao, ExportedProgram) to Torch-MLIR to MLIR middle end (fusion, decomposition, lowering) to MLIR backend (dispatch, partition, codegen). The backend emits LLVM-IR for the host runtime on the ARM Cortex-A9 and NPU ISA for the driver; the runtime reaches the driver through __delegate__, and the driver runs the NPU.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5 0 10Z" class="mk"/></marker>
    <marker id="d2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#3b3631"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5 0 10Z" class="mkc"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5 0 10Z" class="mkn"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#444"/></marker>
    <style>
      text { font-family: Helvetica, Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill:#111; font-size:17px }
      .box { fill:#fff; stroke:#1f2d3d; stroke-width:2.5 }
      .dev { fill:#0d1b3e }
      .ar  { stroke:#111; stroke-width:4.5; fill:none }
      .lbl { font-size:15px }
      .sm  { font-size:14px; fill:#333 }
      .ttl { font-weight:700; font-size:18px }
      .cap { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", serif; font-size:21px }
      .mono { font-family: Consolas, Menlo, monospace; font-size:13px; fill:#444 }
      .chip { fill:none; stroke:#fff; stroke-width:2 }
      .dt { fill:#fff; font-size:13px }

      .bg { fill:#fbf8f3 }
      text { fill:#2f2a25 }
      .sm, .mono { fill:#2f2a25; opacity:.8 }
      .box { fill:#fffdf9; stroke:#5b524a }
      .frame { fill:#f2ece3; stroke:#5b524a; stroke-width:2.5; stroke-dasharray:none }
      .ar { stroke:#3b3631 }  .mk { fill:#3b3631 }
      .arc { stroke:#3b3631 } .mkc { fill:#3b3631 } .boxc { stroke:#3b3631; fill:#fffdf9 } .devc { fill:#3b3631 }
      .arn { stroke:#3b3631 } .mkn { fill:#3b3631 } .boxn { stroke:#3b3631; fill:#fffdf9 } .devn { fill:#3b3631 }
      .dt { fill:#fff; opacity:1 }
      .hw { fill:#e9e2d7 }
    </style>
  </defs>
  <rect width="1790" height="330" class="bg"/>

  <!-- Model Format -->
  <rect x="20" y="112" width="140" height="96" rx="6" class="box"/>
  <text x="90" y="144" text-anchor="middle" class="ttl">Model Format</text>
  <text x="90" y="170" text-anchor="middle" class="sm">.safetensors</text>
  <text x="90" y="190" text-anchor="middle" class="sm">.torchvision</text>
  <path d="M160 160H202" class="ar" marker-end="url(#a)"/>

  <!-- PyTorch -->
  <rect x="210" y="112" width="170" height="96" class="box"/>
  <text x="295" y="144" text-anchor="middle" class="ttl">PyTorch</text>
  <text x="295" y="170" text-anchor="middle">torchao,</text>
  <text x="295" y="192" text-anchor="middle">ExportedProgram</text>
  <path d="M380 160H442" class="ar" marker-end="url(#a)"/>
  <text x="413" y="188" text-anchor="middle" class="lbl">ATen</text>

  <!-- Torch-MLIR -->
  <rect x="450" y="112" width="150" height="96" class="box"/>
  <text x="525" y="166" text-anchor="middle" class="ttl">Torch-MLIR</text>
  <path d="M600 160H654" class="ar" marker-end="url(#a)"/>
  <text x="628" y="188" text-anchor="middle" class="lbl">Torch</text>
  <text x="628" y="207" text-anchor="middle" class="lbl">Dialect</text>

  <!-- MLIR frame -->
  <rect x="662" y="44" width="456" height="210" rx="8" class="frame"/>
  <text x="890" y="70" text-anchor="middle" class="ttl" style="font-size:20px">Pynqo MLIR</text>

  <!-- Middle End -->
  <rect x="680" y="88" width="180" height="148" class="box"/>
  <text x="770" y="117" text-anchor="middle" class="ttl">Middle End</text>
  <text x="704" y="152">Fusion,</text>
  <text x="704" y="178">Decomposition,</text>
  <text x="704" y="204">Lowering</text>
  <path d="M860 160H912" class="ar" marker-end="url(#a)"/>

  <!-- Backend -->
  <rect x="920" y="88" width="180" height="148" class="box"/>
  <text x="1010" y="117" text-anchor="middle" class="ttl">Backend</text>
  <text x="944" y="152">Dispatch,</text>
  <text x="944" y="178">Partition,</text>
  <text x="944" y="204">Codegen</text>

  <!-- CPU line -->
  <path d="M1100 98H1182" class="ar arc" marker-end="url(#ac)"/>
  <text x="1152" y="86" text-anchor="middle" class="lbl">LLVM IR</text>
  <rect x="1190" y="66" width="120" height="64" class="box"/>
  <text x="1250" y="104" text-anchor="middle" class="ttl">LLVM</text>
  <path d="M1310 98H1372" class="ar arc" marker-end="url(#ac)"/>
  <text x="1341" y="86" text-anchor="middle" class="lbl">.so</text>
  <rect x="1380" y="66" width="140" height="64" class="box boxc"/>
  <text x="1450" y="104" text-anchor="middle" class="ttl">Runtime</text>
  <path d="M1520 98H1562" class="ar arc" marker-end="url(#ac)"/>

  <!-- NPU line -->
  <path d="M1100 222H1372" class="ar arn" marker-end="url(#an)"/>
  <text x="1236" y="210" text-anchor="middle" class="lbl">NPU ISA</text>
  <rect x="1380" y="190" width="140" height="64" class="box boxn"/>
  <text x="1450" y="228" text-anchor="middle" class="ttl">Driver</text>
  <path d="M1520 222H1562" class="ar arn" marker-end="url(#an)"/>

  <!-- delegate: runtime -> driver -->
  <path d="M1450 130V186" stroke="#444" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#d)"/>
  <text x="1458" y="162" class="mono">__delegate__</text>

  <rect x="1570" y="58" width="200" height="80" style="fill:#3b3631;stroke:#3b3631;stroke-width:2.5"/>
  <svg x="1576" y="68" width="60" height="60" viewBox="0 -960 960 960"><path d="M360 -120v-80H260q-24 0-42-18t-18-42v-100h-80v-60h80v-124h-80v-60h80v-100q0-24 18-42t42-18h100v-76h60v76h124v-76h60v76h100q24 0 42 18t18 42v100h76v60h-76v124h76v60h-76v100q0 24-18 42t-42 18H604v80h-60v-80H420v80h-60Zm344-140v-444H260v444h444ZM480-480Z" fill="#fffdf9"/></svg>
  <text x="1606" y="102" text-anchor="middle" style="fill:#fffdf9;font-size:10px;font-weight:700">CPU</text>
  <text x="1644" y="104" style="fill:#fffdf9;font-size:16px;font-weight:700">ARM Cortex-A9</text>
  <rect x="1570" y="182" width="200" height="80" style="fill:#3b3631;stroke:#3b3631;stroke-width:2.5"/>
  <svg x="1576" y="192" width="60" height="60" viewBox="0 -960 960 960"><path d="M360 -120v-80H260q-24 0-42-18t-18-42v-100h-80v-60h80v-124h-80v-60h80v-100q0-24 18-42t42-18h100v-76h60v76h124v-76h60v76h100q24 0 42 18t18 42v100h76v60h-76v124h76v60h-76v100q0 24-18 42t-42 18H604v80h-60v-80H420v80h-60Zm344-140v-444H260v444h444ZM480-480Z" fill="#fffdf9"/></svg>
  <text x="1606" y="226" text-anchor="middle" style="fill:#fffdf9;font-size:10px;font-weight:700">NPU</text>
  <text x="1644" y="228" style="fill:#fffdf9;font-size:16px;font-weight:700">NPU</text>

  <text x="895" y="300" text-anchor="middle" class="cap">Figure 1: NPU-MLIR — AI Compilation Stack (PYNQ-Z1)</text>
</svg>
