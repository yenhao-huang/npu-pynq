name: cd

# Continuous deployment validates a release branch, before anything is tagged,
# published, or merged into `main`. A push event uses the workflow file from the
# branch it ran on, so this validates itself as well as the release.
#
# A passing run publishes a DRAFT Release carrying the packages, checksums and
# board evidence. A draft has no tag and is not public. The draft becomes a real
# Release only through `release-publish.yml`, and only once its commit is
# contained in `main`.
on:
  push:
    branches:
      - 'release/v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pynq-z1-production-cd
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_commit: ${{ steps.version.outputs.release_commit }}
    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and check the release version
        id: version
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          declared="$(python3 .github/cd/resolve_release_version.py --format tag)"

          # The branch names the version it is releasing, so a run cannot be
          # aimed at one version while the changelog declares another.
          case "$BRANCH" in
            release/*)
              named="${BRANCH#release/}"
              if [ "$named" != "$declared" ]; then
                echo "branch $BRANCH releases $named but the changelog declares $declared" >&2
                exit 1
              fi
              ;;
            *)
              echo "cd runs on a release/vMAJOR.MINOR.PATCH branch; got $BRANCH" >&2
              exit 1
              ;;
          esac

          if git rev-parse -q --verify "refs/tags/${declared}" >/dev/null; then
            echo "$declared is already tagged; releases are never republished" >&2
            exit 1
          fi

          echo "release_tag=$declared" >> "$GITHUB_OUTPUT"
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  host-checks:
    needs: validate-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.release_commit }}

      - name: Install open-source EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade --break-system-packages numpy pyyaml

      - name: Lint RTL
        run: make -C src/test lint

      - name: Run simulations
        run: make -C src/test sim

      - name: Run host model and example suites
        run: make -C src/test model PYTHON=python3

  # The release converts and validates its own model from pinned sources, with
  # the code in this commit. Nothing depends on files left on some machine, and
  # the model always matches the conversion code it ships with. It needs neither
  # Vivado nor the board, so it runs on a hosted machine alongside the preflights.
  build-model:
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.release_commit }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned conversion environment
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r examples/resnet18/requirements-convert.txt

      - name: Download the pinned checkpoint and calibration images
        run: |
          python examples/resnet18/scripts/download_model.py
          python examples/resnet18/scripts/download_calibration.py

      - name: Convert to the NPU package
        run: python examples/resnet18/scripts/convert_model.py

      - name: Validate against the independent integer reference
        run: python examples/resnet18/scripts/verify_model.py --software-timeout 7200

      - name: Prepare the demo input and the bundled gallery
        run: |
          python examples/resnet18/scripts/download_demo_assets.py
          python examples/resnet18/scripts/prepare_demo_image.py --software-timeout 7200
          python examples/resnet18/scripts/download_gallery.py

      # The board refuses a demo it classifies wrongly, but only after hours of
      # Vivado and an hour of inference. The host record already knows.
      - name: Require the host to classify the demo correctly
        shell: python
        run: |
          import json, sys
          record = json.load(open("examples/resnet18/model/resnet18.demo.json", encoding="utf-8"))
          top, expected = record["host_top_k"][0], record["expected"]
          print(f"host top-1: {top['name']} ({top['probability']:.2%})")
          if expected is not None and top["index"] != expected["index"]:
              sys.exit(f"host predicts {top['name']!r}, the demo expects {expected['name']!r}")

      - name: Confirm the workspace is package-ready
        run: python examples/resnet18/package_example.py --check-only

      - name: Retain the model workspace
        uses: actions/upload-artifact@v4
        with:
          name: resnet18-model-${{ needs.validate-source.outputs.release_tag }}
          if-no-files-found: error
          path: |
            examples/resnet18/model/*
            !examples/resnet18/model/calibration
            !examples/resnet18/model/.gitkeep

  # Everything the privileged jobs need is checked here, in about a minute,
  # before Vivado spends hours on a build that would fail at packaging.
  preflight-vivado:
    needs: validate-source
    runs-on: [self-hosted, vivado]
    timeout-minutes: 10
    steps:
      # Windows PowerShell is always present; pwsh may not be, and it is the
      # first thing to check.
      - name: Check the runner's tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $problems = @()
          foreach ($tool in 'pwsh', 'python', 'vivado', 'git', 'tar') {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if ($found) { Write-Host "ok    $tool -> $($found.Source)" }
            else { $problems += "$tool is not on this runner's PATH" }
          }
          if ($problems) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            throw "$($problems.Count) preflight problem(s); nothing expensive was started"
          }
          Write-Host 'PASS: Vivado runner is ready'

  preflight-board:
    needs: validate-source
    runs-on: [self-hosted, pynq-z1]
    timeout-minutes: 5
    steps:
      - name: Check that the PYNQ-Z1 answers over SSH
        shell: powershell
        env:
          PYNQ_BOARD_HOST: ${{ vars.PYNQ_BOARD_HOST }}
          PYNQ_BOARD_USER: ${{ vars.PYNQ_BOARD_USER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hostName = if ($env:PYNQ_BOARD_HOST) { $env:PYNQ_BOARD_HOST } else { '192.168.2.99' }
          $userName = if ($env:PYNQ_BOARD_USER) { $env:PYNQ_BOARD_USER } else { 'xilinx' }
          foreach ($tool in 'ssh', 'scp') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is not on this runner's PATH"
            }
          }
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new `
            "$userName@$hostName" 'test -r /etc/profile.d/pynq_venv.sh && echo reachable'
          if ($LASTEXITCODE -ne 0) {
            throw "cannot reach $userName@$hostName without a password prompt"
          }
          Write-Host 'PASS: board is reachable'

  build-overlay:
    needs: [validate-source, host-checks, build-model, preflight-vivado, preflight-board]
    runs-on: [self-hosted, vivado]
    timeout-minutes: 180
    env:
      RESNET18_MODEL_DIR: build/resnet18-model
    steps:
      # CD never creates a tag, so the release commit is the only exact ref.
      - name: Check out the validated release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-source.outputs.release_commit }}

      # After checkout, which would otherwise delete it as untracked.
      - name: Download the model this release built
        uses: actions/download-artifact@v4
        with:
          name: resnet18-model-${{ needs.validate-source.outputs.release_tag }}
          path: build/resnet18-model

      - name: Build routed overlay and bitstream
        shell: pwsh
        run: |
          vivado -mode batch -nojournal -nolog `
            -source src/hw/vivado_tcl/npu_matrix/build_overlay.tcl
          if ($LASTEXITCODE -ne 0) {
            throw "Vivado failed with exit code $LASTEXITCODE"
          }

      - name: Verify BIT HWH and provenance manifest
        shell: pwsh
        run: |
          python src/runtime/verify_overlay.py `
            build/vivado/npu_matrix_8x8/artifacts
          if ($LASTEXITCODE -ne 0) {
            throw "overlay verification failed with exit code $LASTEXITCODE"
          }

      - name: Verify build evidence exists
        shell: pwsh
        run: |
          $evidence = 'build/vivado/npu_matrix_8x8/reports/build_evidence.txt'
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) {
            throw "missing build evidence: $evidence"
          }

      - name: Assemble standalone matrix example
        shell: pwsh
        run: |
          $tag = '${{ needs.validate-source.outputs.release_tag }}'
          $commit = '${{ needs.validate-source.outputs.release_commit }}'
          $package = "mount/matrix-multiplication/$tag"
          python examples/matrix-multiplication/package_example.py `
            --repository-root . `
            --artifact-dir build/vivado/npu_matrix_8x8/artifacts `
            --output-dir $package `
            --release-tag $tag `
            --source-commit $commit
          if ($LASTEXITCODE -ne 0) {
            throw "package assembly failed with exit code $LASTEXITCODE"
          }
          New-Item -ItemType Directory -Force 'build/cd' | Out-Null
          tar -czf "build/cd/npu-matrix-$tag.tar.gz" -C $package .
          if ($LASTEXITCODE -ne 0) {
            throw "package archive failed with exit code $LASTEXITCODE"
          }

      - name: Assemble standalone ResNet-18 release package
        shell: pwsh
        run: |
          $tag = '${{ needs.validate-source.outputs.release_tag }}'
          $commit = '${{ needs.validate-source.outputs.release_commit }}'
          New-Item -ItemType Directory -Force 'build/cd' | Out-Null
          python examples/resnet18/package_example.py `
            --repository-root . `
            --artifact-dir build/vivado/npu_matrix_8x8/artifacts `
            --report-dir build/vivado/npu_matrix_8x8/reports `
            --model-dir $env:RESNET18_MODEL_DIR `
            --output-archive "build/cd/npu-resnet18-$tag.zip" `
            --release-tag $tag `
            --source-commit $commit
          if ($LASTEXITCODE -ne 0) {
            throw "ResNet-18 package assembly failed with exit code $LASTEXITCODE"
          }

      - name: Record deterministic checksums
        shell: pwsh
        run: |
          $tag = '${{ needs.validate-source.outputs.release_tag }}'
          $files = @(
            'build/vivado/npu_matrix_8x8/artifacts/npu_matrix.bit',
            'build/vivado/npu_matrix_8x8/artifacts/npu_matrix.hwh',
            'build/vivado/npu_matrix_8x8/artifacts/npu_matrix.manifest.json',
            'build/vivado/npu_matrix_8x8/reports/build_evidence.txt',
            "build/cd/npu-matrix-$tag.tar.gz",
            "build/cd/npu-resnet18-$tag.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          [IO.File]::WriteAllLines('build/cd/SHA256SUMS', $lines)

      - name: Retain overlay and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: npu-build-${{ needs.validate-source.outputs.release_tag }}
          if-no-files-found: error
          path: |
            build/vivado/npu_matrix_8x8/artifacts/npu_matrix.bit
            build/vivado/npu_matrix_8x8/artifacts/npu_matrix.hwh
            build/vivado/npu_matrix_8x8/artifacts/npu_matrix.manifest.json
            build/vivado/npu_matrix_8x8/reports/build_evidence.txt

      - name: Retain standalone deployment packages
        uses: actions/upload-artifact@v4
        with:
          name: npu-packages-${{ needs.validate-source.outputs.release_tag }}
          if-no-files-found: error
          path: |
            build/cd/npu-matrix-${{ needs.validate-source.outputs.release_tag }}.tar.gz
            build/cd/npu-resnet18-${{ needs.validate-source.outputs.release_tag }}.zip
            build/cd/SHA256SUMS

  board-validation:
    needs: [validate-source, build-overlay]
    runs-on: [self-hosted, pynq-z1]
    timeout-minutes: 240
    environment: pynq-z1-production
    steps:
      - name: Check out deployment wrappers
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.release_commit }}

      - name: Download standalone deployment packages
        uses: actions/download-artifact@v4
        with:
          name: npu-packages-${{ needs.validate-source.outputs.release_tag }}
          path: build/cd-download

      - name: Verify checksums before deployment
        shell: pwsh
        run: |
          Push-Location 'build/cd-download'
          try {
            foreach ($line in Get-Content 'SHA256SUMS') {
              $parts = $line -split '\s+', 2
              $name = $parts[1].Trim()
              if (-not (Test-Path -LiteralPath $name -PathType Leaf)) { continue }
              $actual = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $parts[0].Trim().ToLowerInvariant()) {
                throw "checksum mismatch for $name"
              }
            }
          }
          finally {
            Pop-Location
          }

      - name: Extract standalone matrix package
        shell: pwsh
        run: |
          $tag = '${{ needs.validate-source.outputs.release_tag }}'
          New-Item -ItemType Directory -Force 'build/cd-package' | Out-Null
          tar -xzf "build/cd-download/npu-matrix-$tag.tar.gz" -C 'build/cd-package'
          if ($LASTEXITCODE -ne 0) {
            throw "package extraction failed with exit code $LASTEXITCODE"
          }

      - name: Deploy and execute the matrix example
        shell: pwsh
        env:
          PYNQ_BOARD_HOST: ${{ vars.PYNQ_BOARD_HOST }}
          PYNQ_BOARD_USER: ${{ vars.PYNQ_BOARD_USER }}
          PYNQ_REMOTE_ROOT: ${{ vars.PYNQ_REMOTE_ROOT }}
        run: |
          $hostName = if ($env:PYNQ_BOARD_HOST) { $env:PYNQ_BOARD_HOST } else { 'pynq_board' }
          $userName = if ($env:PYNQ_BOARD_USER) { $env:PYNQ_BOARD_USER } else { 'xilinx' }
          $remoteRoot = if ($env:PYNQ_REMOTE_ROOT) { $env:PYNQ_REMOTE_ROOT } else { '/home/xilinx/jupyter_notebooks/npu_matrix' }
          & examples/matrix-multiplication/deploy_release.ps1 `
            -PackagePath 'build/cd-package' `
            -ReleaseTag '${{ needs.validate-source.outputs.release_tag }}' `
            -DeploymentId '${{ github.run_id }}-${{ github.run_attempt }}' `
            -EvidencePath 'build/board/board-evidence.json' `
            -BoardHost $hostName `
            -BoardUser $userName `
            -RemoteRoot $remoteRoot

      - name: Deploy and accept the ResNet-18 release package
        shell: pwsh
        env:
          PYNQ_BOARD_HOST: ${{ vars.PYNQ_BOARD_HOST }}
          PYNQ_BOARD_USER: ${{ vars.PYNQ_BOARD_USER }}
          PYNQ_RESNET18_REMOTE_ROOT: ${{ vars.PYNQ_RESNET18_REMOTE_ROOT }}
        run: |
          $tag = '${{ needs.validate-source.outputs.release_tag }}'
          $hostName = if ($env:PYNQ_BOARD_HOST) { $env:PYNQ_BOARD_HOST } else { '192.168.2.99' }
          $userName = if ($env:PYNQ_BOARD_USER) { $env:PYNQ_BOARD_USER } else { 'xilinx' }
          $remoteRoot = if ($env:PYNQ_RESNET18_REMOTE_ROOT) { $env:PYNQ_RESNET18_REMOTE_ROOT } else { '/home/xilinx/jupyter_notebooks/npu_resnet18' }
          & .github/cd/resnet18_deploy_and_accept.ps1 `
            -PackageArchive "build/cd-download/npu-resnet18-$tag.zip" `
            -ReleaseTag $tag `
            -DeploymentId '${{ github.run_id }}-${{ github.run_attempt }}' `
            -EvidencePath 'build/board/resnet18-board-evidence.json' `
            -BoardHost $hostName `
            -BoardUser $userName `
            -RemoteRoot $remoteRoot

      - name: Run the real-image inference acceptance on the board
        shell: pwsh
        env:
          PYNQ_BOARD_HOST: ${{ vars.PYNQ_BOARD_HOST }}
          PYNQ_BOARD_USER: ${{ vars.PYNQ_BOARD_USER }}
          PYNQ_RESNET18_REMOTE_ROOT: ${{ vars.PYNQ_RESNET18_REMOTE_ROOT }}
        run: |
          $hostName = if ($env:PYNQ_BOARD_HOST) { $env:PYNQ_BOARD_HOST } else { '192.168.2.99' }
          $userName = if ($env:PYNQ_BOARD_USER) { $env:PYNQ_BOARD_USER } else { 'xilinx' }
          $remoteRoot = if ($env:PYNQ_RESNET18_REMOTE_ROOT) { $env:PYNQ_RESNET18_REMOTE_ROOT } else { '/home/xilinx/jupyter_notebooks/npu_resnet18' }
          & .github/cd/resnet18_accept_image.ps1 `
            -ReleaseTag '${{ needs.validate-source.outputs.release_tag }}' `
            -DeploymentId '${{ github.run_id }}-${{ github.run_attempt }}' `
            -EvidencePath 'build/board/resnet18-image-acceptance.json' `
            -BoardHost $hostName `
            -BoardUser $userName `
            -RemoteRoot $remoteRoot

      - name: Retain board evidence
        uses: actions/upload-artifact@v4
        with:
          name: npu-board-${{ needs.validate-source.outputs.release_tag }}
          if-no-files-found: error
          path: |
            build/board/board-evidence.json
            build/board/resnet18-board-evidence.json
            build/board/resnet18-image-acceptance.json

  publish-draft:
    needs: [validate-source, host-checks, build-model, build-overlay, board-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.release_commit }}

      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: npu-packages-${{ needs.validate-source.outputs.release_tag }}
          path: build/release

      - name: Download overlay artifacts
        uses: actions/download-artifact@v4
        with:
          name: npu-build-${{ needs.validate-source.outputs.release_tag }}
          path: build/release

      - name: Download board acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: npu-board-${{ needs.validate-source.outputs.release_tag }}
          path: build/release

      - name: Verify checksums and evidence
        shell: bash
        env:
          TAG: ${{ needs.validate-source.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd build/release
          sha256sum --check --strict SHA256SUMS
          test -s "npu-resnet18-${TAG}.zip"
          test -s resnet18-board-evidence.json
          test -s resnet18-image-acceptance.json

      - name: Publish the validated draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-source.outputs.release_tag }}
          COMMIT: ${{ needs.validate-source.outputs.release_commit }}
          CHANGELOG: changelog/${{ needs.validate-source.outputs.release_tag }}.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A draft carries no tag and is not public. Recreate it on every run so
          # the draft always reflects the newest validated commit.
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes
          fi
          {
            cat "$CHANGELOG"
            echo
            echo "---"
            echo
            echo "Validated by CD run $RUN_URL at commit \`$COMMIT\`."
          } > build/notes.md
          gh release create "$TAG" \
            --draft \
            --target "$COMMIT" \
            --title "$TAG" \
            --notes-file build/notes.md \
            build/release/npu-resnet18-"$TAG".zip \
            build/release/npu-matrix-"$TAG".tar.gz \
            build/release/npu_matrix.bit \
            build/release/npu_matrix.hwh \
            build/release/npu_matrix.manifest.json \
            build/release/build_evidence.txt \
            build/release/board-evidence.json \
            build/release/resnet18-board-evidence.json \
            build/release/resnet18-image-acceptance.json \
            build/release/SHA256SUMS

      - name: Say what to do next
        shell: bash
        env:
          TAG: ${{ needs.validate-source.outputs.release_tag }}
        run: |
          {
            echo "## $TAG is validated"
            echo
            echo "A draft Release now holds the packages, checksums and board evidence."
            echo "It has no tag and is not public yet."
            echo
            echo "Next: open a pull request from this release branch into \`main\`,"
            echo "merge it **with a merge commit** (not a squash, which would leave"
            echo "this validated commit out of \`main\`), then run the"
            echo "\`release-publish\` workflow for $TAG."
          } >> "$GITHUB_STEP_SUMMARY"
