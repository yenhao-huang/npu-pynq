name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install open-source EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog

      - name: Lint RTL
        run: make -C sim lint

      - name: Run simulations
        run: make -C sim sim

      - name: Run host-side Python tests
        run: python -m unittest discover -s sw/mac_npu -p 'test_*.py' -v

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waves
          path: sim/waves/
          if-no-files-found: ignore
