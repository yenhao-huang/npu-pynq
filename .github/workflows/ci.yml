name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install open-source EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog

      - name: Lint RTL
        run: make -C src/test lint

      - name: Run simulations
        run: make -C src/test sim

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade --break-system-packages numpy pyyaml pillow

      - name: Run host model and example suites
        run: make -C src/test model PYTHON=python3

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waves
          path: src/test/waves/
          if-no-files-found: ignore

  # Enforced pre-merge gate for `main`. A promotion that does not declare the
  # version it will release cannot reach `main`, so continuous deployment never
  # has to guess which release a validated commit publishes.
  release-readiness:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python gate dependencies
        run: python3 -m pip install --upgrade --break-system-packages pyyaml

      - name: Resolve the release version this promotion declares
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          python3 .github/release/version.py --output resolution.env
          . ./resolution.env
          if [ "${should_release}" != "true" ]; then
            echo "this promotion declares no new release version" >&2
            echo "add changelog/vMAJOR.MINOR.PATCH.md for the version to publish" >&2
            exit 1
          fi
          echo "promotion declares ${release_tag} (${changelog_path})"

      - name: Verify continuous deployment still gates the Release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import yaml

          release = yaml.safe_load(open(".github/workflows/release.yml", encoding="utf-8"))
          triggers = release[True] if True in release else release["on"]
          branches = triggers.get("push", {}).get("branches") or []
          if not any(str(pattern).startswith("release/") for pattern in branches):
              sys.exit("release.yml must run on release/* branches")
          draft = release["jobs"]["draft-release"]
          required = {"check", "export", "build-bitstream", "test-on-board"}
          if not required.issubset(set(draft["needs"])):
              sys.exit("draft-release must depend on every validation job")
          for name, job in release["jobs"].items():
              if name == "draft-release":
                  continue
              if job.get("permissions", {}).get("contents") == "write":
                  sys.exit(f"{name} must not hold contents: write")

          publish = yaml.safe_load(
              open(".github/workflows/publish.yml", encoding="utf-8")
          )
          publish_triggers = publish[True] if True in publish else publish["on"]
          if set(publish_triggers) != {"workflow_dispatch"}:
              sys.exit("publish.yml must only run on workflow_dispatch")
          if publish["jobs"]["publish"]["environment"] != "pynq-z1-release":
              sys.exit("publishing must go through the pynq-z1-release environment")
          PY
