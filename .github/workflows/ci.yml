name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install open-source EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog yosys

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test paper-informed IC operations
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e tools/ic pytest
          .venv/bin/python -m pytest tools/ic/tests/test_runstore.py tools/ic/tests/test_exploration.py tools/ic/tests/test_wide_exploration.py tools/ic/tests/test_network_exploration.py tools/ic/tests/test_architecture_sweep.py tools/ic/tests/test_fifo_exploration.py tools/ic/tests/test_arithmetic_exploration.py tools/ic/tests/test_physical_analysis.py tools/ic/tests/test_candidate_ablation.py tools/ic/tests/test_acceptance_audit.py tools/ic/tests/test_process_timeout.py tools/ic/tests/test_netlist_analysis.py tools/ic/tests/test_datapath_exploration.py tools/ic/tests/test_linear_exploration.py tools/ic/tests/test_affine_equivalence.py tools/ic/tests/test_iterative_exploration.py tools/ic/tests/test_systolic_exploration.py tools/ic/tests/test_booth_exploration.py tools/ic/tests/test_fsm_exploration.py tools/ic/tests/test_timing_audit.py tools/ic/tests/test_regfile_exploration.py tools/ic/tests/test_skid_exploration.py tools/ic/tests/test_registry.py tools/ic/tests/test_cli_catalogue.py -q

      - name: Lint RTL
        run: make -C src/test lint

      - name: Run simulations
        run: make -C src/test sim

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waves
          path: src/test/waves/
          if-no-files-found: ignore
