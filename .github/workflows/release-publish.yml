name: release-publish

# Publishes the draft Release that continuous deployment validated, and nothing
# else. It builds nothing, runs nothing on the board, and refuses any draft
# whose commit is not already contained in `main`, so the tag it creates always
# names a commit that is both validated and merged.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Validated draft Release to publish, for example v0.1.5
        required: true

permissions:
  contents: read

concurrency:
  group: pynq-z1-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pynq-z1-release
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify the draft is validated and merged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          state="$(gh release view "$TAG" --json isDraft,targetCommitish)"
          if [ "$(echo "$state" | jq -r .isDraft)" != "true" ]; then
            echo "$TAG is not a draft; only a draft validated by cd.yml is published here" >&2
            exit 1
          fi
          commit="$(echo "$state" | jq -r .targetCommitish)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "draft does not target an exact commit: $commit" >&2
            exit 1
          fi

          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "$TAG is already tagged; releases are never republished" >&2
            exit 1
          fi

          # The validated commit must be on main. A squash merge would leave it
          # out, and the release would then name a commit main does not contain.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "$commit is not contained in origin/main." >&2
            echo "Merge the release branch with a merge commit, not a squash." >&2
            exit 1
          fi

          # The assets are the ones cd.yml attached; publishing must not invent any.
          for asset in \
            "npu-resnet18-${TAG}.zip" \
            "SHA256SUMS" \
            "resnet18-board-evidence.json" \
            "resnet18-image-acceptance.json"
          do
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
              echo "draft is missing the validated asset: $asset" >&2
              exit 1
            fi
          done

      - name: Publish the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "published $TAG"
